<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Kasa Katalog</title>
</head>
<body>
    <header>
        <a class="logo" href="#">Kasa Katalog</a>
        <div class="header-right">
             <input class="search-input" type="text" placeholder="E46, W211, R34...">
        </div>
    </header>

    <div class="layout">
        <aside>
            <div class="filter-group">
                <span class="filter-label">Marka</span>
                <div class="filter-options">
                    <button class="filter-btn active">
                        Tümü
                        <span class="filter-count">132</span>
                    </button>
                    <button class="filter-btn">
                        BWM
                        <span class="filter-count">38</span>
                    </button>
                    <button class="filter-btn">
                        Mercedes
                        <span class="filter-count">31</span>
                    </button>
                    <button class="filter-btn">
                        Audi
                        <span class="filter-count">24</span>
                    </button>
                    <button class="filter-btn">
                        Porsche
                        <span class="filter-count">18</span>
                    </button>
                    <button class="filter-btn">
                        Nissan
                        <span class="filter-count">12</span>
                    </button>
                    <button class="filter-btn">
                        Toyota
                        <span class="filter-count">19</span>
                    </button>

                </div>
            </div>
            <div class="filter-group">
                <span class="filter-label">Yakıt</span>
                <div class="filter-options">
                    <button class="filter-btn active">
                        Tümü
                    </button>
                    <button class="filter-btn">
                        Benzin
                    </button>
                    <button class="filter-btn">
                        Dizel
                    </button>
                    <button class="filter-btn">
                        Elektrik
                    </button>
                    <button class="filter-btn">
                        Hibrit
                    </button>
                </div>
            </div>
            <div class="filter-group">
                <span class="filter-label">Kasa Tipi</span>
                <div class="filter-options">
                    <button class="filter-btn active">
                        Tümü
                    </button>
                    <button class="filter-btn">Sedan </button>
                    <button class="filter-btn">Coupe</button>
                    <button class="filter-btn">Wagon</button>
                    <button class="filter-btn">Hatchback</button>
                    <button class="filter-btn">SUV</button>
                    <button class="filter-btn">Cabrio</button>
                </div>
            </div>
        </aside>

        <div class="detail-preview">
            <div class="section-label">↓ Detay Sayfası</div>
            <div class="detail-grid">
            <div>
                    <div class="detail-header">
                        <div class="detail-code"></div>
                        <div class="detail-subtitle"></div>
                    </div>
                    <p class="detail-description"></p>
                    <div class="spec-table">
                        <div class="spec-row">
                            <span class="spec-key"></span>
                            <span class="spec-val"></span>
                        </div>
                         <div class="spec-row">
                            <span class="spec-key"></span>
                            <span class="spec-val"></span>
                        </div>
                         <div class="spec-row">
                            <span class="spec-key"></span>
                            <span class="spec-val"></span>
                        </div>
                         <div class="spec-row">
                            <span class="spec-key"></span>
                            <span class="spec-val"></span>
                        </div>  
                    </div>
                    <div class="engines-section">
                        <table class="engines-table">
                            <thead>
                                <tr>
                                    <th></th>
                                    <th></th>
                                    <th></th>
                                    <th></th>
                                    <th>t</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td></td>
                                    <td></td>

                                </tr>
                                <tr>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
            </div>
            <div class="detail-image-sticky">
                <div class="detail-main-image">
                    <img src="" alt="">
                </div>
             
            
                <div class="sidebar-card">
                <div class="sidebar-card-label">İlgıli Kasalar</div>
                <div class="related-item">
                    <span class="related-code">E36</span>
                    <span class="related-years">1990-2000</span>
                </div>
                <div class="related-item">
                    <span class="related-code">E90</span>
                    <span class="related-years">2005-2012</span>
                </div>
                <div class="related-item">
                    <span class="related-code">E30</span>
                    <span class="related-years">1982-1994</span>
                </div>
                </div>
                <div class="sidebar-card">
                <div class="sidebar-card-label">Kasa Tipleri</div>
                <div class="related-item">
                    <span class="related-code">Sedan</span>
                    <div class="related-years">E46/4</div>
                </div>
                 <div class="related-item">
                    <span class="related-code">Coupe</span>
                    <div class="related-years">E46/2</div>
                </div>
                 <div class="related-item">
                    <span class="related-code">Wagon</span>
                    <div class="related-years">E46/5</div>
                </div>
                 <div class="related-item">
                    <span class="related-code">Cabrio</span>
                    <div class="related-years">E46/C</div>
                </div>
                </div>
            </div>
        </div>

        


    </div>

    <footer>
        <span class="footer-text">kasa.kodları - 2026</span>

    <script src="detail.js"></script>

</html>
