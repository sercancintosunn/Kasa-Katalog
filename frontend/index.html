<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Kasa Katalog</title>
</head>
<body>
    <header>
        <a class="logo" href="index.html">Kasa Katalog</a>
        <div class="header-right"> 
            <input class="search-input" type="text" placeholder="E46, W211, R34...">
    
        </div>
    </header>

    <div class="layout">
        <aside>
            <div class="filter-group">
                <span class="filter-label">Marka</span>
                <div class="filter-options">
                    <button class="filter-btn active">
                        Tümü
                        <span class="filter-count">132</span>
                    </button>
                    <button class="filter-btn">
                        BWM
                        <span class="filter-count">38</span>
                    </button>
                    <button class="filter-btn">
                        Mercedes
                        <span class="filter-count">31</span>
                    </button>
                    <button class="filter-btn">
                        Audi
                        <span class="filter-count">24</span>
                    </button>
                    <button class="filter-btn">
                        Porsche
                        <span class="filter-count">18</span>
                    </button>
                    <button class="filter-btn">
                        Nissan
                        <span class="filter-count">12</span>
                    </button>
                    <button class="filter-btn">
                        Toyota
                        <span class="filter-count">19</span>
                    </button>

                </div>
            </div>
            <div class="filter-group">
                <span class="filter-label">Yakıt</span>
                <div class="filter-options">
                    <button class="filter-btn active">
                        Tümü
                    </button>
                    <button class="filter-btn">
                        Benzin
                    </button>
                    <button class="filter-btn">
                        Dizel
                    </button>
                    <button class="filter-btn">
                        Elektrik
                    </button>
                    <button class="filter-btn">
                        Hibrit
                    </button>
                </div>
            </div>
            <div class="filter-group">
                <span class="filter-label">Kasa Tipi</span>
                <div class="filter-options">
                    <button class="filter-btn active">
                        Tümü
                    </button>
                    <button class="filter-btn">Sedan </button>
                    <button class="filter-btn">Coupe</button>
                    <button class="filter-btn">Wagon</button>
                    <button class="filter-btn">Hatchback</button>
                    <button class="filter-btn">SUV</button>
                    <button class="filter-btn">Cabrio</button>
                </div>
            </div>
        </aside>

        <main>
            <div class="content-header">
                <span class="content-title"><b>142</b> araba listeleniyor</span>
            
            <div class="view-toggle">
                <button class="view-btn active">⊞</button>
                <button class="view-btn">☰</button>
            </div>
            </div>

            <div class="chassis-grid">


                
                <div class="chassis-card">
                    <div class="card-body">
                        <div class="card-top">
                            <span class="code"></span>
                            <span class="brand"></span>
                        </div>
                        <div class="chassis-model"></div>
                        <div class="chassis-year"></div>
                        <div class="card-tags">
                            <span class="tag"></span>
                            
                        </div>
                        <div class="card-engines">
                            <div class="engine-row">
                                <span class="engine-code"></span>
                                <span class="engine-power"></span>
                            </div>
                           
                        </div>
                    </div>
                    <div class="card-image">
                        <img src="" alt="">
                    </div>
                </div>
               
               
                
            </div>

        </main>
    </div>

    <footer>
        <span class="footer-text">kasa.kodları - 2026</span>
        <span class="footer-text">Created By Sercan Çintosun</span>
    </footer>

    <script src="app.js"></script>
</body>
</html>
